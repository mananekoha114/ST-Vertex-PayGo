name: Installer compatibility
on:
  push:
    paths: ['scripts/install*.mjs', 'scripts/sync-update-launchers.mjs', 'install.sh', 'install.ps1', 'bootstrap.sh', 'bootstrap.ps1', 'update.sh', 'update.ps1', 'test/install.test.mjs', '.github/workflows/installer.yml']
  pull_request:
    paths: ['scripts/install*.mjs', 'scripts/sync-update-launchers.mjs', 'install.sh', 'install.ps1', 'bootstrap.sh', 'bootstrap.ps1', 'update.sh', 'update.ps1', 'test/install.test.mjs', '.github/workflows/installer.yml']
  workflow_dispatch:
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-update-launchers.mjs --check
      - run: node --test test/install.test.mjs
      - name: POSIX launcher
        shell: bash
        run: |
          sh ./install.sh --help
          sh ./bootstrap.sh --help
          sh ./update.sh --help
      - name: PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 --help
          ./bootstrap.ps1 --help
          ./update.ps1 --help
